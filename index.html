<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrier Lead Finder</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f5f6f8;margin:0;color:#17202a}main{max-width:1100px;margin:auto;padding:20px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:14px}h1{margin:0 0 4px;font-size:25px}.muted{color:#697586;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,button{font:inherit;min-height:44px;box-sizing:border-box;border-radius:9px;border:1px solid #cfd5dc;padding:9px 11px;background:white}button{cursor:pointer;font-weight:650}button.primary{background:#17202a;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.lead{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-top:1px solid #e4e7eb}.phone{font-size:21px;font-weight:800;margin:6px 0}.pill{display:inline-block;border:1px solid #d7dce2;border-radius:999px;padding:3px 8px;font-size:12px;margin:2px}.danger{color:#9b1c1c}.queue{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:10px 0;z-index:2}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.lead{grid-template-columns:1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}main{padding:12px}}</style></head><body><main><div class="card"><h1>Carrier Lead Finder</h1><div class="muted">FMCSA public carrier data → cleaned → deduplicated → calling queue</div><div class="grid" style="margin-top:14px"><input id="q" placeholder="Company / USDOT / MC / phone"><select id="state"><option value="">All states</option><option>AL</option><option>AR</option><option>AZ</option><option>CA</option><option>CO</option><option>FL</option><option>GA</option><option>IL</option><option>IN</option><option>KY</option><option>LA</option><option>MI</option><option>MO</option><option>MS</option><option>NC</option><option>NJ</option><option>NY</option><option>OH</option><option>OK</option><option>PA</option><option>SC</option><option>TN</option><option>TX</option><option>VA</option><option>WI</option></select><select id="type"><option value="">All verified classifications</option><option>General Freight</option><option>Fresh Produce</option><option>Refrigerated Food</option><option>Building Materials</option><option>Machinery</option><option>Motor Vehicles</option><option>Intermodal</option><option>Agricultural</option><option>Construction</option><option>Dry Van</option><option>Reefer</option><option>Flatbed</option><option>Box Truck</option><option>Power Only</option></select><select id="status"><option value="">All statuses</option><option>New</option><option>Called</option><option>Interested</option><option>Callback</option><option>Not Interested</option></select></div><div class="grid" style="margin-top:10px"><select id="units"><option value="0">Any power units</option><option value="1">1+ units</option><option value="3">3+ units</option><option value="5">5+ units</option><option value="10">10+ units</option><option value="20">20+ units</option></select><select id="drivers"><option value="0">Any drivers</option><option value="1">1+ drivers</option><option value="3">3+ drivers</option><option value="5">5+ drivers</option><option value="10">10+ drivers</option></select><select id="limit"><option>25</option><option>50</option><option>100</option></select><div></div></div><div class="actions" style="margin-top:12px"><button class="primary" id="find">Find Leads</button><button id="import">Refresh FMCSA Data</button><button id="export">Export CSV</button><button id="copy">Copy Visible Numbers</button></div><div id="msg" class="muted" style="margin-top:10px"></div></div><div class="card queue"><div class="actions"><strong id="count">0 leads</strong><button id="prev">Previous</button><button id="next">Next</button><button id="queue">Calling Queue</button></div></div><div class="card"><div id="list"><div class="muted">Import the public FMCSA dataset to populate leads.</div></div></div></main><script>
const $=id=>document.getElementById(id);let page=1,rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const p=new URLSearchParams({q:$('q').value,state:$('state').value,type:$('type').value,status:$('status').value,minUnits:$('units').value,minDrivers:$('drivers').value,limit:$('limit').value,page});const r=await fetch('/api/leads?'+p);const j=await r.json();rows=j.data||[];$('count').textContent=`${j.total} leads • page ${j.page}/${Math.max(j.pages,1)}`;$('list').innerHTML=rows.length?rows.map(x=>`<div class="lead"><div><div><strong>${esc(x.company_name)}</strong> <span class="pill">${esc(x.state)}</span><span class="pill">${x.power_units} units</span><span class="pill">Score ${x.lead_score}</span><span class="pill">${esc(x.status)}</span></div><div class="phone">${esc(x.phone)}</div><div class="muted">USDOT ${esc(x.usdot)} ${x.mc_mx?'• '+esc(x.mc_mx):''} • ${esc(x.city||'')} ${esc(x.state||'')} ${esc(x.zip||'')} • ${esc(x.truck_types.join(', ')||'No verified equipment/classification')}</div></div><div class="actions"><button data-copy="${x.id}">COPY</button><a href="tel:${esc(x.phone)}"><button>CALL</button></a><select data-status="${x.id}"><option>New</option><option>Called</option><option>Interested</option><option>Callback</option><option>Not Interested</option></select><button data-score="${x.id}">SCORE</button></div></div>`).join(''):'<div class="muted">No matching leads. Try broader filters or import the dataset.</div>';
rows.forEach(x=>{const s=document.querySelector(`[data-status="${x.id}"]`);if(s)s.value=x.status});bind();}
function bind(){document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const x=rows.find(x=>String(x.id)===b.dataset.copy);if(x){await navigator.clipboard.writeText(x.phone);b.textContent='COPIED';setTimeout(()=>b.textContent='COPY',800)}});document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{await fetch('/api/leads/'+s.dataset.status,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});if(s.value==='Called')setTimeout(()=>nextLead(),250)});document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>{const x=rows.find(x=>String(x.id)===b.dataset.score);if(x)alert(`Lead Score: ${x.lead_score}/100\n\nHigher score = more complete/active business data, fleet size, drivers and verified classification. No information is invented.`)});}
function nextLead(){if(page*Number($('limit').value)<Number($('count').textContent)||rows.length===Number($('limit').value)){page++;load()}}
$('find').onclick=()=>{page=1;load()};$('next').onclick=()=>{page++;load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('queue').onclick=()=>{$('status').value='New';page=1;load()};$('export').onclick=()=>location.href='/api/export';$('copy').onclick=async()=>{if(rows.length){await navigator.clipboard.writeText(rows.map(x=>x.phone).join('\n'));$('msg').textContent='Visible phone numbers copied.'}};$('import').onclick=async()=>{ $('msg').textContent='Downloading/importing FMCSA data. This can take a while for the first run.';const r=await fetch('/api/import',{method:'POST'});const j=await r.json();$('msg').textContent=j.message||j.output||'Import started.'};['q','state','type','status','units','drivers','limit'].forEach(id=>$(id).addEventListener('change',()=>{page=1;load()}));load();
</script></body></html>
