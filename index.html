<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrier Lead Finder</title>
<style>
:root{--b:#0f172a}*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f1f5f9;color:var(--b);padding:8px}
.box{background:#fff;border-radius:12px;padding:12px;margin:10px auto;max-width:900px;box-shadow:0 1px 3px #0002}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}label{font-size:12px;color:#475569;display:block}
input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
button,.call{padding:11px 12px;border:0;border-radius:8px;background:#e2e8f0;font-weight:700;cursor:pointer;font-size:14px;color:var(--b)}
.find{background:var(--b);color:#fff;grid-column:1/-1;font-size:18px}.ph{font-size:32px;font-weight:800;margin:6px 0;user-select:all}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.row>*{flex:1 1 90px}
.copy{background:#16a34a;color:#fff}.call{background:#2563eb;color:#fff;text-decoration:none;text-align:center}
.sub{color:#475569;margin:2px 0}.sc{background:#fef3c7;color:#92400e;margin-top:6px}.st{float:right;font-size:12px;background:#e2e8f0;border-radius:99px;padding:2px 10px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.bar>*{flex:1 1 100px}
</style></head><body>
<div class="box"><b>Carrier Lead Finder</b> <span class="sub" id="meta"></span>
<form id="f" onsubmit="event.preventDefault();load(0)">
<div><label>State</label><select name="state" id="state"><option value="">All</option></select></div>
<div><label>Truck / cargo type</label><select name="cargo" id="cargo"><option value="">Any</option></select></div>
<div><label>Min power units</label><input name="minPower" type="number" min="0"></div>
<div><label>Min drivers</label><input name="minDrivers" type="number" min="0"></div>
<div><label>Name / USDOT / MC</label><input name="q"></div>
<div><label>Lead status</label><select name="status"><option value="">Any</option><option>new</option><option>called</option><option>interested</option><option>callback</option><option>not_interested</option></select></div>
<div><label>Number of leads</label><select name="limit"><option>25</option><option>50</option><option>100</option></select></div>
<button class="find">FIND LEADS</button></form>
<div class="row"><button id="qb" onclick="S.queue=!S.queue;load(0)">Calling Queue: OFF</button><button onclick="location='/api/export.csv?'+qs()">Export CSV</button></div></div>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s);let S={rows:[],total:0,off:0,queue:false,i:0};
const fmt=p=>`(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const loc=iso=>iso?new Date(iso).toLocaleString('sv').slice(0,16).replace(' ','T'):'';
function qs(x={}){const p=new URLSearchParams();for(const[k,v]of new FormData($('#f')))if(v)p.set(k,v);if(S.queue)p.set('queue','1');for(const k in x)p.set(k,x[k]);return p}
async function init(){const m=await(await fetch('/api/meta')).json();
 m.states.forEach(s=>$('#state').add(new Option(`${s.state} (${s.n})`,s.state)));m.cargo.forEach(c=>$('#cargo').add(new Option(c.label,c.key)));
 $('#meta').textContent=m.total?`· ${m.total.toLocaleString()} carriers with phones · last import ${m.lastImport?.finished?.slice(0,10)}`:'· database empty: run "npm run import"'}
async function load(off){S.off=off;S.i=0;const r=await(await fetch('/api/leads?'+qs({offset:off}))).json();S.rows=r.rows;S.total=r.total;
 $('#qb').textContent='Calling Queue: '+(S.queue?'ON':'OFF');render()}
function card(r,i){return `<div class="box"><span class="st">${r.lead_status}</span><b>${esc(r.name)}</b>
<div class="ph">${fmt(r.phone)}</div>
<div class="sub">USDOT ${r.dot}${r.mc?' · '+r.mc:''} · ${esc(r.city)}, ${r.state} ${r.zip||''}</div>
<div class="sub">${r.cargo_labels.length?'Cargo (FMCSA-reported): '+esc(r.cargo_labels.join(', ')):'Cargo: not reported'} · ${r.power_units} power units · ${r.drivers} drivers</div>
<div class="sub">Source: ${esc(r.source)} · MCS-150 date ${r.source_updated||'n/a'}</div>
<button class="sc" onclick="sc(${i})">Lead Score: ${r.score}/100 ▾</button><div id="sc${i}" class="sub" hidden>${r.breakdown.map(p=>`${p.ok?'✓':'✗'} ${p.label} (${p.ok?'+'+p.pts:'0'}/${p.pts})`).join('<br>')}</div>
<div class="row"><button class="copy" onclick="cp(${i},this)">COPY NUMBER</button><a class="call" href="tel:${r.phone}">CALL</a></div>
<textarea id="n${i}" rows="2" placeholder="Notes">${esc(r.notes)}</textarea><label>Callback date/time</label><input id="c${i}" type="datetime-local" value="${loc(r.callback_at)}">
<div class="row">${[['called','CALLED'],['interested','INTERESTED'],['callback','CALLBACK'],['not_interested','NOT INTERESTED']].map(([s,l])=>`<button onclick="mark(${i},'${s}')">${l}</button>`).join('')}</div></div>`}
function render(){const o=$('#out'),lim=+new FormData($('#f')).get('limit');
 if(!S.total){o.innerHTML='<div class="box">No leads match. Loosen the filters or run the import.</div>';return}
 if(S.queue){if(S.i>=S.rows.length){o.innerHTML='<div class="box">Queue finished. Press FIND LEADS for more.</div>';return}
  o.innerHTML=`<div class="box bar"><button onclick="go(-1)">◀ Previous</button><span>Lead ${S.i+1} of ${S.rows.length} (${S.total} in queue)</span><button onclick="skip()">Skip</button><button onclick="go(1)">Next ▶</button></div>`+card(S.rows[S.i],S.i);return}
 o.innerHTML=`<div class="box">${S.total} leads · showing ${S.off+1}–${S.off+S.rows.length}</div>`+S.rows.map(card).join('')+
 `<div class="box bar"><button ${S.off?'':'disabled'} onclick="load(${S.off-lim});scrollTo(0,0)">Previous</button><button ${S.off+lim<S.total?'':'disabled'} onclick="load(${S.off+lim});scrollTo(0,0)">Next</button></div>`}
const go=d=>{S.i=Math.max(0,Math.min(S.rows.length,S.i+d));render()};
const skip=()=>{S.rows.push(S.rows.splice(S.i,1)[0]);render()};
const sc=i=>{const e=$('#sc'+i);e.hidden=!e.hidden};
async function cp(i,b){const t=fmt(S.rows[i].phone);try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}
 const o=b.textContent;b.textContent='COPIED ✓';setTimeout(()=>b.textContent=o,1200)}
async function mark(i,s){const r=S.rows[i],cb=$('#c'+i).value;if(s==='callback'&&!cb)return alert('Pick a callback date/time first');
 r.notes=$('#n'+i).value;r.callback_at=cb?new Date(cb).toISOString():null;
 await fetch('/api/leads/'+r.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s,notes:r.notes,callback_at:r.callback_at})});
 r.lead_status=s;if(S.queue){if(s==='callback')S.i++;else S.rows.splice(S.i,1)}render()}
init();
</script></body></html>
